; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanoatmega328

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
; Desktop mocks belong to the native environment, not the physical Nano.
test_ignore = test_ds18b20_monitor
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.5
    olikraus/U8g2@~2.36.5
    makuna/RTC@~2.5.0

[env:native]
platform = native@1.2.1
test_framework = unity
test_filter = test_ds18b20_monitor
; Compile production sources separately against shared native mock state.
test_build_src = yes
build_flags =
    -std=c++11
    -Wall
    -Wextra
    -Werror
    -Itest/test_ds18b20_monitor/mocks
    ; Keep the Windows test executable independent of compiler runtime DLLs.
    -static
